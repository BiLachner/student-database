<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%{title}</title>
    <link rel="stylesheet" href="style.css">
    <script src="student-database.js"></script>
    <script src="/teacher-navigation.js" defer></script>
</head>
    <body>
        <header>
            <form action="/logout" method="post">
                <input type="hidden" name="test-key" value="Value just so BadRequest is not triggered because of an empty post request">
                <button type="submit" class="logout-button">
                    <!-- "log-out" icon from Feather Icons (https://feathericons.com), MIT License, Copyright (c) 2013-2023 Cole Bemis -->
                    <svg class="logout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Ausloggen
                </button>
            </form>
        </header>
        %{content}
    </body>
</html>
